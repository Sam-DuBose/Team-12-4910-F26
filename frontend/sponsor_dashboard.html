<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sponsor Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <nav>
      <a href="FrontPage.html">Log Out</a>
    </nav>
    <main>
      <h1 style="text-align: center;">Sponsor Dashboard</h1>
      <p style="text-align: center;">Welcome, Sponsor. Your product catalog and driver reports will appear here.</p>

      <!-- Product catalog: shows current availability for each product -->
      <h2>Product Catalog</h2>
      <table class="catalog-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price (points)</th>
            <th>Availability</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="3" class="catalog-empty">Catalog will load here from the product API.</td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
